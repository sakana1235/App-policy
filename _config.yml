# GitHub Pages (Jekyll) settings
title: App Policies
description: Privacy policies and terms for our apps.
lang: ja

# ▼ サイト共通の連絡先メールアドレス（各ポリシーの front matter で個別に上書き可能）
contact_email: "support@niyareco.love"

# サイトの公開 URL（GitHub Pages の設定に合わせる）
# 例: https://sakana1235.github.io/App-policy
url: "https://sakana1235.github.io"
baseurl: "/App-policy"

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - README.md
  - _templates
  - Gemfile
  - Gemfile.lock
  - vendor

defaults:
  - scope:
      path: ""
    values:
      langs: ["ja", "en", "zh"]
